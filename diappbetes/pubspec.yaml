name: diappbetes
description: Aplicación de gestión de diabetes — migración Flutter desde Ionic/Angular.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  intl: ^0.19.0
  flutter_localizations:
    sdk: flutter
  cloud_firestore: ^6.4.1
  firebase_auth: ^6.5.1
  firebase_core: ^4.9.0
  
  # ── HTTP (OpenFoodFacts) ───────────────────────────────────────────────── #
  http: ^1.2.0

  # ── Escáner de código de barras ───────────────────────────────────────── #
  mobile_scanner: ^6.0.0

  # ── Utilidades ────────────────────────────────────────────────────────── #
  flutter_secure_storage: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/LogoDiAppBetes.png
    - assets/TickContaseñaCambiada.png
    - assets/favicon.png
