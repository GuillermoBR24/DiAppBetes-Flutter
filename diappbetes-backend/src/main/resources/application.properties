spring.application.name=diappbetes-backend
server.port=8080

# Ruta al JSON de Firebase (variable de entorno en producción)
firebase.credentials.path=${FIREBASE_CREDENTIALS_PATH:/opt/diappbetes/firebase-service-account.json}

# API Key secreta — definida como variable de entorno
api.secret-key=${API_SECRET_KEY:cambia-esto-en-produccion}

# Logging
logging.level.com.diappbetes=DEBUG
logging.level.root=WARN